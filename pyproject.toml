[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "news-insight"
version = "0.1.0"
description = "Closed-set news tagging and key-fact extraction over the news-crawler /v1 API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
]

[project.optional-dependencies]
# 版本与 CI（.github/workflows/ci.yml）保持一致，避免本地与 CI 结论不同。
# pyyaml 同时供 tools/yaml_lint.py 与 tests/test_yaml_lint.py 使用，版本与 CI 一致。
dev = ["pytest>=8.0", "ruff==0.17.3", "mypy==2.4.1", "pyyaml>=6,<7", "types-PyYAML>=6.0,<7"]

# yaml lint job 只装这一组：不再为校验 2 个 YAML 拉 fastapi/uvicorn/httpx/pydantic
# 这些运行依赖（冷装实测纯 pyyaml 1.9s、这一组 19.4s、dev 组 37s——差额主要是构建本项目本身）。
# 依赖面越小，纯 YAML 门禁越不容易因无关依赖变更变红。
yaml = ["pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["backups", "data", "data_live", "fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E501 不启用：既有代码有 55 处超长行，为一次"加 CI"改 55 行会淹没真实 diff。
# 需要收紧时先单独跑 ruff format，再移除这一行。
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
# tools/ 也要纳入：tools/yaml_lint.py 是 CI 门禁的一部分，只靠"跑到才炸"不够。
files = ["app", "tools"]
