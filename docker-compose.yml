services:
  insight:
    build:
      context: .
    image: news-insight:0.1.0
    container_name: news-insight
    restart: unless-stopped
    ports:
      # 默认只听回环：POST /v1/analyze 会消耗 LLM 额度，不该默认暴露到局域网
      - "${INSIGHT_BIND:-127.0.0.1}:${INSIGHT_PORT:-8020}:8020"
    environment:
      # 上游 news-crawler；Linux 下 host.docker.internal 由 extra_hosts 提供
      NEWS_BASE_URL: ${NEWS_BASE_URL:-http://host.docker.internal:8000}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      # auto = 上游不可达时自动回退内置演示数据；live = 失败即报错；demo = 只用演示数据
      NEWS_SOURCE_MODE: ${NEWS_SOURCE_MODE:-auto}
      NEWS_PAGE_SIZE: ${NEWS_PAGE_SIZE:-20}
      NEWS_TIMEOUT: ${NEWS_TIMEOUT:-15}
      # 详情补正文的并发（每篇一次 GET /v1/articles/{id}）
      NEWS_DETAIL_CONCURRENCY: ${NEWS_DETAIL_CONCURRENCY:-16}
      # 分析并发：每篇 3 次串行 LLM 调用，线程数按 10000 篇/2 小时设计
      ANALYZE_CONCURRENCY: ${ANALYZE_CONCURRENCY:-100}
      # 主线程每 N 篇提交一次 SQLite，避免每篇一次 fsync
      ANALYZE_WRITE_BATCH: ${ANALYZE_WRITE_BATCH:-50}
      # 异步作业排队上限（queued + running），超过返回 429
      ANALYZE_MAX_PENDING_JOBS: ${ANALYZE_MAX_PENDING_JOBS:-50}
      # 超过该天数的分析结果自动删除；0 = 永久保留
      RETENTION_DAYS: ${RETENTION_DAYS:-90}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      # 供应商侧同时请求上限；超过时本地排队（默认与 ANALYZE_CONCURRENCY 对齐）
      LLM_MAX_CONCURRENCY: ${LLM_MAX_CONCURRENCY:-100}
      # 入站鉴权：用户登录用 Bearer Token；服务间调用可用 X-API-Key
      INSIGHT_API_KEY: ${INSIGHT_API_KEY:-}
      INSIGHT_REQUIRE_AUTH: ${INSIGHT_REQUIRE_AUTH:-0}
      # 首次启动且 users 表为空时创建管理员
      INSIGHT_ADMIN_USERNAME: ${INSIGHT_ADMIN_USERNAME:-admin}
      INSIGHT_ADMIN_PASSWORD: ${INSIGHT_ADMIN_PASSWORD:-}
      INSIGHT_SESSION_TTL_DAYS: ${INSIGHT_SESSION_TTL_DAYS:-7}
      MAX_TAGS_PER_ARTICLE: ${MAX_TAGS_PER_ARTICLE:-5}
      TAG_BODY_CHARS: ${TAG_BODY_CHARS:-1200}
      EXTRACT_BODY_CHARS: ${EXTRACT_BODY_CHARS:-6000}
      DATA_DIR: /app/data
    # 默认用命名卷：bind mount 的 ./data 由 docker daemon 以 root:root 创建，
    # 而容器以 uid 10001 运行，Linux 上首次启动会因无法读写 SQLite 而崩溃循环。
    # 想直接看到 insight.db：设 INSIGHT_DATA_DIR=./data，并先 mkdir -p data && sudo chown 10001 data
    volumes:
      - ${INSIGHT_DATA_DIR:-insight_data}:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  insight_data:
