services:
  insight:
    build:
      context: .
    image: news-insight:0.1.0
    container_name: news-insight
    restart: unless-stopped
    ports:
      # 默认只听回环：POST /v1/analyze 会消耗 LLM 额度，不该默认暴露到局域网
      - "${INSIGHT_BIND:-127.0.0.1}:${INSIGHT_PORT:-8020}:8020"
    environment:
      # 上游 news-crawler；Linux 下 host.docker.internal 由 extra_hosts 提供
      NEWS_BASE_URL: ${NEWS_BASE_URL:-http://host.docker.internal:8000}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      # auto = 上游不可达时自动回退内置演示数据；live = 失败即报错；demo = 只用演示数据
      NEWS_SOURCE_MODE: ${NEWS_SOURCE_MODE:-auto}
      NEWS_PAGE_SIZE: ${NEWS_PAGE_SIZE:-20}
      NEWS_TIMEOUT: ${NEWS_TIMEOUT:-15}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      LLM_TIMEOUT: ${LLM_TIMEOUT:-60}
      LLM_TEMPERATURE: ${LLM_TEMPERATURE:-0}
      # 入站鉴权：设置 INSIGHT_API_KEY 后除 /health 与文档外都需 X-API-Key / Bearer
      INSIGHT_API_KEY: ${INSIGHT_API_KEY:-}
      INSIGHT_REQUIRE_AUTH: ${INSIGHT_REQUIRE_AUTH:-0}
      MAX_TAGS_PER_ARTICLE: ${MAX_TAGS_PER_ARTICLE:-5}
      TAG_BODY_CHARS: ${TAG_BODY_CHARS:-1200}
      EXTRACT_BODY_CHARS: ${EXTRACT_BODY_CHARS:-6000}
      DATA_DIR: /app/data
    # 默认用命名卷：bind mount 的 ./data 由 docker daemon 以 root:root 创建，
    # 而容器以 uid 10001 运行，Linux 上首次启动会因无法读写 SQLite 而崩溃循环。
    # 想直接看到 insight.db：设 INSIGHT_DATA_DIR=./data，并先 mkdir -p data && sudo chown 10001 data
    volumes:
      - ${INSIGHT_DATA_DIR:-insight_data}:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  insight_data:
