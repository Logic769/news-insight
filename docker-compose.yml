services:
  insight:
    build:
      context: .
    image: news-insight:0.1.0
    container_name: news-insight
    restart: unless-stopped
    ports:
      - "${INSIGHT_PORT:-8020}:8020"
    environment:
      # 上游 news-crawler；Linux 下 host.docker.internal 由 extra_hosts 提供
      NEWS_BASE_URL: ${NEWS_BASE_URL:-http://host.docker.internal:8000}
      NEWS_API_KEY: ${NEWS_API_KEY:-}
      # auto = 上游不可达时自动回退内置演示数据；live = 失败即报错；demo = 只用演示数据
      NEWS_SOURCE_MODE: ${NEWS_SOURCE_MODE:-auto}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.deepseek.com}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      MAX_TAGS_PER_ARTICLE: ${MAX_TAGS_PER_ARTICLE:-5}
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
