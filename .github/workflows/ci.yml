name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # 只在 PR 上取消旧跑：master 的每次 push 都要留下被验证过的记录，
  # 否则连续 push 会取消前一次，合并进来的提交实际从未经过 CI。
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-checks:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Byte-compile all sources
        run: python -m compileall -q app tests

      # 规则集与排除项在 pyproject.toml 的 [tool.ruff] 中，CI 与本地保持一致。
      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        if: matrix.python-version == '3.12'
        run: python -m mypy

      # 全部用例离线：LLM 与上游 HTTP 都在测试里被替身替换，不消耗额度。
      - name: Pytest
        run: python -m pytest -q -p no:cacheprovider

  yaml-lint:
    name: yaml lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate YAML files
        run: |
          python -m pip install --upgrade pip
          pip install "pyyaml>=6,<7"
          python - <<'PY'
          import pathlib
          import sys

          import yaml

          MERGE_TAG = "tag:yaml.org,2002:merge"


          class UniqueKeyLoader(yaml.SafeLoader):
              """拒绝重复映射键，同时不误杀合法的 << merge key。"""


          def _construct_mapping(loader, node, deep=False):
              seen = set()
              for key_node, _ in node.value:
                  # << 由 SafeConstructor.flatten_mapping 展开，不能在这里单独构造；
                  # 显式键覆盖 merge 进来的同名键是 YAML 允许的写法，不算重复。
                  if key_node.tag == MERGE_TAG:
                      continue
                  key = loader.construct_object(key_node, deep=deep)
                  if key in seen:
                      raise yaml.constructor.ConstructorError(
                          None, None, f"duplicate mapping key: {key!r}", key_node.start_mark
                      )
                  seen.add(key)
              return yaml.SafeLoader.construct_mapping(loader, node, deep=deep)


          UniqueKeyLoader.add_constructor(
              yaml.resolver.BaseResolver.DEFAULT_MAPPING_TAG, _construct_mapping
          )

          SKIP = {".git", "backups", "data", "data_live"}
          candidates = sorted(pathlib.Path(".").rglob("*.yml")) + sorted(
              pathlib.Path(".").rglob("*.yaml")
          )
          paths = [p for p in candidates if not any(part in SKIP for part in p.parts)]

          bad = []
          for path in paths:
              text = path.read_text(encoding="utf-8")
              try:
                  yaml.load(text, Loader=UniqueKeyLoader)
              except yaml.YAMLError as exc:
                  bad.append(f"{path}: {exc}")
              except UnicodeDecodeError as exc:
                  bad.append(f"{path}: 不是 UTF-8 编码: {exc}")
          print("\n".join(bad) if bad else f"all {len(paths)} YAML files parsed")
          sys.exit(1 if bad else 0)
          PY

  docker-build:
    name: docker build + container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config >/dev/null

      - name: Build image
        run: docker build -t news-insight:ci .

      - name: Container tests
        run: |
          # 容器内没有 pytest：用一次性覆盖层装依赖，避免把测试依赖塞进生产镜像。
          docker run --rm \
            -v "$PWD/tests:/app/tests:ro" \
            -e DATA_DIR=/tmp/data \
            news-insight:ci sh -c "
              python -m pip install --user --no-cache-dir -q pytest &&
              python -m pytest -q -p no:cacheprovider /app/tests
            "

      - name: Container boots and serves /health
        run: |
          docker run -d --name insight-ci -p 18020:8020 -e DATA_DIR=/tmp/data news-insight:ci
          # 冷 runner 上 uvicorn 启动 + init_db + 启动期 prune 偶尔超过 30s，
          # 给到 60 次 × 2s，避免把慢启动误判成坏镜像。
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18020/health >/dev/null 2>&1; then
              echo "health OK"
              curl -sS http://127.0.0.1:18020/health
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          docker logs insight-ci
          exit 1
