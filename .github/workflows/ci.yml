name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # PR 共用一个并发组并在新 push 时取消旧跑，省 runner。
  # master 每次 push 独立成组（带 sha）、互不取消，保证每个提交都留下 CI 记录；
  # 代价是连续 push 会并行占用多个 runner。
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python-checks:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Byte-compile all sources
        run: python -m compileall -q app tests tools

      # 规则集与排除项在 pyproject.toml 的 [tool.ruff] 中，CI 与本地保持一致。
      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        if: matrix.python-version == '3.12'
        run: python -m mypy

      # 全部用例离线：LLM 与上游 HTTP 都在测试里被替身替换，不消耗额度。
      - name: Pytest
        run: python -m pytest -q -p no:cacheprovider

  yaml-lint:
    name: yaml lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Validate YAML files
        run: |
          python -m pip install --upgrade pip
          # 只装 yaml 组：版本声明留在 pyproject.toml 一处，又不把 YAML 门禁耦合到运行依赖。
          pip install ".[yaml]"
          # 校验逻辑放在 tools/yaml_lint.py，本地与 CI 跑的是同一份代码。
          python tools/yaml_lint.py

  docker-build:
    name: docker build + container smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate compose config
        run: docker compose config >/dev/null

      - name: Build image
        run: docker build -t news-insight:ci .

      - name: Container tests
        run: |
          # 容器内没有 pytest/pyyaml：一次性装进 --user 目录，避免把测试依赖塞进生产镜像。
          # tools/ 要一起挂进去，test_yaml_lint.py 会加载它。
          docker run --rm \
            -v "$PWD/tests:/app/tests:ro" \
            -v "$PWD/tools:/app/tools:ro" \
            -e DATA_DIR=/tmp/data \
            news-insight:ci sh -c "
              python -m pip install --user --no-cache-dir -q pytest 'pyyaml>=6,<7' &&
              python -m pytest -q -p no:cacheprovider /app/tests
            "

      - name: Container boots and serves /health
        run: |
          docker run -d --name insight-ci -p 18020:8020 -e DATA_DIR=/tmp/data news-insight:ci
          # 冷 runner 上 uvicorn 启动 + init_db + 启动期 prune 偶尔超过 30s，
          # 给到 60 次 × 2s，避免把慢启动误判成坏镜像。
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:18020/health >/dev/null 2>&1; then
              echo "health OK"
              curl -sS http://127.0.0.1:18020/health
              exit 0
            fi
            sleep 2
          done
          echo "container never became healthy"
          docker logs insight-ci
          exit 1
